services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: smart-email-advisor-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_email_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_email_advisor}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smart-email-network

  # Redis для кешування та черги повідомлень
  redis:
    image: redis:7-alpine
    container_name: smart-email-advisor-redis
    restart: always
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - smart-email-network

  # AI Agent сервіс
  ai-agent:
    build: 
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: smart-email-advisor-ai-agent
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smart_email_advisor}
      - REDIS_URL=redis://redis:6379${REDIS_PASSWORD:+?password=${REDIS_PASSWORD}}
      # OPENAI_API_KEY intentionally optional; for Bedrock/Claude, use AWS_BEDROCK_MODEL_ID
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gpt-4}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.3}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BEDROCK_MODEL_ID=${AWS_BEDROCK_MODEL_ID}
      - AWS_BEDROCK_MAX_TOKENS=${AWS_BEDROCK_MAX_TOKENS:-800}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - EMAIL_QUEUE_NAME=${EMAIL_QUEUE_NAME:-email_processing}
      - MAX_EMAILS_PER_MINUTE=${MAX_EMAILS_PER_MINUTE:-100}
      - LLM_RULES_PATH=/app/config/llm_rules.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ai_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - smart-email-network

  # Backend API сервіс
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-email-advisor-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smart_email_advisor}
      - REDIS_URL=redis://redis:6379${REDIS_PASSWORD:+?password=${REDIS_PASSWORD}}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_SES_REGION=${AWS_SES_REGION}
      - AWS_LAMBDA_FUNCTION=${AWS_LAMBDA_FUNCTION}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_AGENT_URL=http://ai-agent:8001
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smart-email-network

  # Event Bridge для обробки подій
  event-bridge:
    build: 
      context: ./event-bridge
      dockerfile: Dockerfile
    container_name: smart-email-advisor-event-bridge
    restart: always
    environment:
      - REDIS_URL=redis://redis:6379${REDIS_PASSWORD:+?password=${REDIS_PASSWORD}}
      - AI_AGENT_URL=http://ai-agent:8001
      - BACKEND_URL=http://backend:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_SES_CONFIG_SET=${AWS_SES_CONFIG_SET}
      - AWS_SNS_TOPIC_ARN=${AWS_SNS_TOPIC_ARN}
      - EMAIL_QUEUE_NAME=${EMAIL_QUEUE_NAME:-email_processing}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    volumes:
      - event_logs:/app/logs
    networks:
      - smart-email-network

  # Frontend сервіс
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
    container_name: smart-email-advisor-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost}
    depends_on:
      - backend
    networks:
      - smart-email-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nginx для проксування
  nginx:
    image: nginx:alpine
    container_name: smart-email-advisor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - smart-email-network
    dns:
      - 127.0.0.11
      - 8.8.8.8

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  ai_logs:
    driver: local
  event_logs:
    driver: local

networks:
  smart-email-network:
    driver: bridge
