version: '3.8'

services:
  # PostgreSQL база даних
  db:
    image: postgres:15
    container_name: smart-email-advisor-db
    restart: always
    environment:
      POSTGRES_DB: smart_email_advisor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-email-network

  # Redis для кешування
  redis:
    image: redis:7-alpine
    container_name: smart-email-advisor-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-email-network

  # Backend API сервіс
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-email-advisor-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/smart_email_advisor
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=docker-secret-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEBUG=True
      - ENVIRONMENT=docker
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    networks:
      - smart-email-network

  # Frontend сервіс (для майбутнього використання)
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-email-advisor-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - smart-email-network
    profiles:
      - frontend  # Опціональний профіль, поки фронтенд не створено

  # Nginx для проксування та статичних файлів
  nginx:
    image: nginx:alpine
    container_name: smart-email-advisor-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - smart-email-network
    profiles:
      - production  # Тільки для продакшену

  # Adminer для управління базою даних (опціонально)
  adminer:
    image: adminer
    container_name: smart-email-advisor-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - smart-email-network
    profiles:
      - dev  # Тільки для розробки

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local

networks:
  smart-email-network:
    driver: bridge